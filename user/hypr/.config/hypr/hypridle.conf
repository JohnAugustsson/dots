general {
    lock_cmd = pidof hyprlock || hyprlock          # start hyprlock only if not already running
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'     # ensure screen wakes after suspend
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'       # wake screen on successful unlock
    unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
    #inhibit_sleep = 3                              # wait until locked before allowing sleep
}

# Lock the session after 32 minutes and 40 seconds of inactivity.
listener {
    timeout = 1960
    on-timeout = loginctl lock-session
}

# Turn the screens off after 16 minutes while unlocked, unless an application
# is actively inhibiting idle behavior (for example, a video or game).
listener {
    timeout = 960
    condition_cmd = ! pidof hyprlock >/dev/null 2>&1
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'           # wake screen on any activity (mouse/keyboard)
}

# Once the session is locked, use the same input-idle timeout but ignore all
# application inhibitors. Input wakes the screens without unlocking the session.
listener {
    timeout = 960
    ignore_inhibit = true
    condition_cmd = pidof hyprlock >/dev/null 2>&1
    condition_retry = 5
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
